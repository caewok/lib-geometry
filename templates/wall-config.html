<fieldset>
  <legend>{{ GeometryLib.moduleName }} </legend>

    <div class="form-group">
      <label for="GeometryLib.top">{{ localize "Top" }}</label>
      <div class="form-fields">
        <input type="number" id="GeometryLib.top" name="flags.wall-height.top" value="{{GeometryLib.top}}" step="1" placeholder="&infin;" >
      </div>
    </div>

    <div class="form-group">
      <label for="GeometryLib.bottom">{{ localize "Bottom" }}</label>
      <div class="form-fields">
        <input type="number" id="GeometryLib.bottom" name="flags.wall-height.bottom" value="{{GeometryLib.bottom}}" step="1" placeholder="-&infin;" >
      </div>
    </div>

</fieldset>
