<fieldset>
  <legend>{{ localize "Wall Height" }} </legend>

    <div class="form-group">
      <label for="libGeometry.top">{{ localize "Top Elevation" }}</label>
      <div class="form-fields">
        <input type="number" id="libGeometry.top" name="flags.wall-height.top" value="{{[wall-height].top}}" step="1" placeholder="&infin;" >
      </div>
    </div>

    <div class="form-group">
      <label for="libGeometry.bottom">{{ localize "Bottom Elevation" }}</label>
      <div class="form-fields">
        <input type="number" id="libGeometry.bottom" name="flags.wall-height.bottom" value="{{[wall-height].bottom}}" step="1" placeholder="-&infin;" >
      </div>
    </div>

</fieldset>
